; Motor driver - STM32G431 on the B-G431B-ESC1.
;
; A separate project from the cube's ESP32 firmware: different silicon, different
; toolchain, nothing shared. Open THIS folder in VS Code, not the repository
; root - PlatformIO binds to the platformio.ini at the folder it is opened on,
; and the root one belongs to the ESP32.
;
; The ST-LINK is the STM32F103 on the break-off daughterboard, so the USB cable
; is both power and programmer. No external debugger.

[env:b_g431b_esc1]
platform = ststm32
board = disco_b_g431b_esc1
framework = arduino
upload_protocol = stlink
monitor_speed = 115200

; REQUIRED - without it driver.init() returns 0 and no PWM is ever generated.
;
; SimpleFOC picks its PWM backend with weak symbols: generic_mcu.cpp holds a weak
; _configure6PWM() that just returns SIMPLEFOC_DRIVER_INIT_FAILED, and
; stm32_mcu.cpp holds the strong override that programs TIM1. PlatformIO packs a
; library into a static archive by default, and a linker extracts an archive
; member only when an unresolved symbol demands it - the weak stub resolves the
; call on sight, so the STM32 member is never pulled in and never overrides it.
; The build still succeeds, so the only symptom is a motor that does not move.
;
; This links the library's objects directly, as the Arduino IDE does.
lib_archive = false

lib_deps =
    askuric/Simple FOC

; SimpleFOC does not build against the Arduino STM32 core this platform ships:
; the core changed enableTimerClock()'s argument type and SimpleFOC still passes
; the old one. Neither the released version nor git master has caught up, so the
; one broken call is patched at build time. See driver/patch_simplefoc.py.
extra_scripts = pre:patch_simplefoc.py
