; Motor driver - STM32G431 on the B-G431B-ESC1.
;
; A separate project from the cube's ESP32 firmware: different silicon, different
; toolchain, nothing shared. Open THIS folder in VS Code, not the repository
; root - PlatformIO binds to the platformio.ini at the folder it is opened on,
; and the root one belongs to the ESP32.
;
; The ST-LINK is the STM32F103 on the break-off daughterboard, so the USB cable
; is both power and programmer. No external debugger.

[env:b_g431b_esc1]
platform = ststm32
board = disco_b_g431b_esc1
framework = arduino
upload_protocol = stlink
monitor_speed = 115200

; Flags the SimpleFOC community documents for this board. HAL_TIM_MODULE_ENABLED
; is the one that matters here: without the timer HAL module compiled in, the
; 6-PWM setup has nothing to configure and driver.init() returns 0 with no
; explanation - which is exactly what we saw. SIMPLEFOC_STM32_DEBUG makes the
; library report which pin or timer it could not use.
build_flags =
    -D HAL_TIM_MODULE_ENABLED
    -D HAL_OPAMP_MODULE_ENABLED
    -D SIMPLEFOC_STM32_DEBUG

lib_deps =
    askuric/Simple FOC

; SimpleFOC does not build against the Arduino STM32 core this platform ships:
; the core changed enableTimerClock()'s argument type and SimpleFOC still passes
; the old one. Neither the released version nor git master has caught up, so the
; one broken call is patched at build time. See driver/patch_simplefoc.py.
extra_scripts = pre:patch_simplefoc.py
