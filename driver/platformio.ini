; Motor driver - STM32G431 on the B-G431B-ESC1.
;
; A separate project from the cube's ESP32 firmware: different silicon, different
; toolchain, nothing shared. Open THIS folder in VS Code, not the repository
; root - PlatformIO binds to the platformio.ini at the folder it is opened on,
; and the root one belongs to the ESP32.
;
; The ST-LINK is the STM32F103 on the break-off daughterboard, so the USB cable
; is both power and programmer. No external debugger.

[env:b_g431b_esc1]
platform = ststm32
board = disco_b_g431b_esc1
framework = arduino
upload_protocol = stlink
monitor_speed = 115200

; SimpleFOC from git, not the registry. The released version calls
; enableTimerClock(TIM_HandleTypeDef*), but Arduino STM32 Core 3 changed that
; signature to TIM_TypeDef*, so the registry build will not compile against the
; core this platform installs. PR #550 fixed it and is merged to master:
;   https://github.com/simplefoc/Arduino-FOC/pull/550
; Revisit once a release carries the fix - master is a moving target.
lib_deps =
    https://github.com/simplefoc/Arduino-FOC.git
