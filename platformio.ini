; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes

; Only the libraries this firmware actually includes. SimpleFOC is deliberately
; absent: it belongs to the STM32 motor driver, which is a separate program on
; separate silicon. PlatformIO compiles every declared lib_dep whether or not
; any source includes it, and SimpleFOC 2.4.0 requires ESP-IDF 5.x, so listing
; it here broke the build over code this firmware never calls.
lib_deps =
    adafruit/Adafruit BNO08x @ ^1.2.5
    esphome/ESPAsyncWebServer-esphome @ ^3.1.0
    madhephaestus/ESP32Servo @ ^3.0.5
